name: Github Actions Tests

on:
  workflow_call:
    secrets:
      pact_broker_username:
        required: true
      pact_broker_password:
        required: true

permissions:
  contents: read

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Detect secrets
        uses: govuk-pay/pay-ci/actions/detect-secrets@2f600380181d780f79bc92c3f648a23c6f2ab17d # 0.0.2

  install-and-compile:
    name: "Install and compile"
    uses: govuk-pay/pay-ci/.github/workflows/_run-node-install-and-compile.yml@2f600380181d780f79bc92c3f648a23c6f2ab17d # 0.0.2
    with:
      has_cypress_tests: true

  tests:
    name: "Unit tests and pacts"
    needs: [ install-and-compile ]
    uses: govuk-pay/pay-ci/.github/workflows/_run-node-unit-tests-and-publish-pacts.yml@2f600380181d780f79bc92c3f648a23c6f2ab17d # 0.0.2
    with:
      publish_pacts: true
    secrets:
      pact_broker_username: ${{ secrets.pact_broker_username }}
      pact_broker_password: ${{ secrets.pact_broker_password }}

  cypress-tests:
    name: "Cypress"
    needs: [ install-and-compile ]
    uses: govuk-pay/pay-ci/.github/workflows/_run-node-cypress-tests.yml@2f600380181d780f79bc92c3f648a23c6f2ab17d # 0.0.2

  pact-providers-contract-tests:
    name: "Provider tests"
    needs: tests
    uses: govuk-pay/pay-ci/.github/workflows/_run-provider-pact-tests-for-consumer.yml@2f600380181d780f79bc92c3f648a23c6f2ab17d # 0.0.2
    strategy:
      matrix:
        provider: [ 'connector' ]
    with:
      consumer: "frontend"
      provider: ${{ matrix.provider }}
    secrets:
      pact_broker_username: ${{ secrets.pact_broker_username }}
      pact_broker_password: ${{ secrets.pact_broker_password }}

  check-docker-base-images-are-manifests:
    uses: govuk-pay/pay-ci/.github/workflows/_validate_docker_image_is_manifest.yml@2f600380181d780f79bc92c3f648a23c6f2ab17d # 0.0.2
